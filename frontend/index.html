<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Startup Legal & Finance Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Default to Dark Mode variables if JS fails, but JS will override */
      --bg-app: #030712;
      --bg-surface: rgba(255, 255, 255, 0.03);
      --bg-surface-hover: rgba(255, 255, 255, 0.08);
      --bg-surface-strong: rgba(255, 255, 255, 0.12);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-primary: #f9fafb;
      --text-muted: #9ca3af;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      --aurora-1: rgba(16, 185, 129, 0.06);
      --aurora-2: rgba(16, 185, 129, 0.04);
    }

    body[data-theme='light'] {
      --bg-app: #f8fafc;
      /* Slate 50 - Very clean */
      --bg-surface: rgba(255, 255, 255, 0.8);
      --bg-surface-hover: rgba(148, 163, 184, 0.05);
      /* Subtle slate tint */
      --bg-surface-strong: #ffffff;
      --border-color: rgba(148, 163, 184, 0.2);
      /* Slate 400 with opacity */
      --text-primary: #0f172a;
      /* Slate 900 */
      --text-muted: #475569;
      /* Slate 600 - Better readability */
      --glass-bg: rgba(255, 255, 255, 0.6);
      --glass-border: rgba(148, 163, 184, 0.15);
      --glass-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
      --aurora-1: rgba(16, 185, 129, 0.08);
      --aurora-2: rgba(52, 211, 153, 0.04);
    }

    body[data-theme='dim'] {
      --bg-app: #0f172a;
      /* Slate 900 */
      --bg-surface: rgba(30, 41, 59, 0.5);
      --bg-surface-hover: rgba(30, 41, 59, 0.8);
      --bg-surface-strong: rgba(30, 41, 59, 1);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-primary: #f1f5f9;
      --text-muted: #94a3b8;
      --glass-bg: rgba(15, 23, 42, 0.6);
      --glass-border: rgba(255, 255, 255, 0.05);
      --glass-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
      --aurora-1: rgba(16, 185, 129, 0.05);
      --aurora-2: rgba(16, 185, 129, 0.02);
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-app);
      color: var(--text-primary);
      margin: 0;
      overflow-x: hidden;
      transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s ease;
    }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .glass-card:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-color);
      transform: translateY(-2px);
      transition: all 0.3s ease;
    }

    /* Custom Scrollbar adapting to theme */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
  <script>
    tailwind.config = {
      darkMode: ['variant', [
        '&:is([data-theme="dark"] *)',
        '&:is([data-theme="dim"] *)',
        '&:is(.dark *)',
      ]],
      theme: {
        extend: {
          colors: {
            background: 'var(--bg-app)',
            surface: 'var(--bg-surface)',
            'surface-hover': 'var(--bg-surface-hover)',
            'surface-strong': 'var(--bg-surface-strong)',
            border: 'var(--border-color)',
            primary: 'var(--text-primary)',
            muted: 'var(--text-muted)',
            glass: 'var(--glass-bg)',
          }
        }
      }
    }
  </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@19.0.0/",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-router-dom": "https://esm.sh/react-router-dom@7.1.5?deps=react@19.0.0,react-dom@19.0.0",
    "lucide-react": "https://esm.sh/lucide-react@0.474.0?deps=react@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "@radix-ui/react-popover": "https://esm.sh/@radix-ui/react-popover@1.1.5?deps=react@19.0.0,react-dom@19.0.0",
    "@radix-ui/react-slot": "https://esm.sh/@radix-ui/react-slot@1.1.1?deps=react@19.0.0,react-dom@19.0.0",
    "@radix-ui/react-tabs": "https://esm.sh/@radix-ui/react-tabs@1.1.2?deps=react@19.0.0,react-dom@19.0.0",
    "class-variance-authority": "https://esm.sh/class-variance-authority@0.7.1",
    "clsx": "https://esm.sh/clsx@2.1.1",
    "tailwind-merge": "https://esm.sh/tailwind-merge@2.6.0",
    "framer-motion": "https://esm.sh/framer-motion@11.11.11?deps=react@19.0.0,react-dom@19.0.0",
    "embla-carousel-react": "https://esm.sh/embla-carousel-react@8.1.5?deps=react@19.0.0"
  }
}
</script>

</head>
